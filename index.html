<style>
  :root { --bar: 15vh; --ink: #f4ece4; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", "Source Han Serif TC", serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }

  /* 電影黑邊 + 字幕（黑背景） */
  .bar { position: fixed; left: 0; right: 0; height: var(--bar); background: #000; z-index: 5;
    transition: transform 1.2s cubic-bezier(.4,0,.2,1); pointer-events: none; }
  #barTop { top: 0; transform: translateY(-100%); }
  #barBot { bottom: 0; transform: translateY(100%); display: flex; align-items: center; justify-content: center; }
  body.cine #barTop, body.cine #barBot { transform: none; }
  .sub { font-size: clamp(16px, 2.5vw, 28px); letter-spacing: .14em; line-height: 1.7; text-align: center;
    padding: 0 16px; opacity: 0; transition: opacity 1.1s ease; font-weight: 300; }
  .sub.on { opacity: 1; }

  /* 全黑畫面 */
  #black { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; align-items: center;
    justify-content: center; transition: opacity 2.4s ease; }
  #black.off { opacity: 0; pointer-events: none; }
  #blackSub { font-size: clamp(18px, 3vw, 34px); max-width: 90vw; }

  /* 標題 / 結尾 */
  .card { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; transition: opacity 1.6s ease; }
  .card.hide { opacity: 0; pointer-events: none; }
  .card h1 { font-weight: 300; font-size: clamp(36px, 7vw, 76px); letter-spacing: .35em; margin: 0 0 0 .35em; }
  .card .line { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, #c98a6a, transparent); }
  .card button { font: inherit; font-size: 18px; letter-spacing: .4em; padding: 14px 34px 14px calc(34px + .4em);
    color: var(--ink); background: transparent; border: 1px solid rgba(244,236,228,.45); border-radius: 2px; cursor: pointer;
    transition: background .3s, border-color .3s; }
  .card button:hover { background: rgba(244,236,228,.08); border-color: rgba(244,236,228,.85); }
  .card button:disabled { opacity: .4; cursor: default; }
  .card small { opacity: .5; letter-spacing: .2em; font-size: 13px; }

  /* 操作提示 */
  #hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 4; text-align: center;
    font-size: 15px; letter-spacing: .15em; text-shadow: 0 1px 6px rgba(0,0,0,.8); opacity: 0; transition: opacity 1.2s; pointer-events: none; width: calc(100% - 32px); }
  #hint.on { opacity: .92; }
  #hint .k { font-size: 12px; opacity: .75; margin-top: 6px; letter-spacing: .1em; }
  #mute { position: fixed; top: 14px; right: 14px; z-index: 30; font: inherit; font-size: 13px; letter-spacing: .1em;
    color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25); padding: 6px 12px; border-radius: 2px; cursor: pointer; display: none; }

  /* 手機搖桿 */
  #joy { position: fixed; left: 28px; bottom: 28px; width: 120px; height: 120px; border-radius: 50%; z-index: 4;
    border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
    background: rgba(255,255,255,.35); }
  body.touch.playing #joy { display: block; }

  /* 對話名字、繼續提示 */
  .nm { display: inline-block; font-size: .72em; letter-spacing: .25em; padding: 2px 6px 2px calc(10px + .25em); margin-right: 14px;
    border: 1px solid rgba(244,236,228,.4); vertical-align: middle; }
  .nm.dad { color: #a9cdf0; border-color: rgba(169,205,240,.55); }
  .nm.mom { color: #f0b3bf; border-color: rgba(240,179,191,.55); }
  .nm.me { color: #f2d48a; border-color: rgba(242,212,138,.55); }
  #dlgNext { position: absolute; right: 28px; bottom: 18px; font-size: 13px; letter-spacing: .2em; opacity: 0; transition: opacity .4s; }
  #dlgNext.on { opacity: .7; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  body.talking #barBot { pointer-events: auto; cursor: pointer; }
  #black.fast { transition: opacity .6s ease; }

  /* 章節標題 */
  #chapTitle { position: fixed; inset: 0; z-index: 11; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  #chapTitle.on { opacity: 1; }
  #chapTitle small { letter-spacing: .6em; font-size: 15px; opacity: .7; margin-left: .6em; }
  #chapTitle h2 { margin: 0 0 0 .4em; font-weight: 300; font-size: clamp(30px, 5.5vw, 56px); letter-spacing: .4em; }

  /* 目標、互動提示、暫停 */
  #obj { position: fixed; left: 18px; top: 58px; z-index: 6; max-width: calc(100% - 36px); opacity: 0; transition: opacity .8s;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); pointer-events: none; border-left: 2px solid rgba(232,180,140,.8); padding: 4px 0 4px 12px; }
  #obj.on { opacity: 1; }
  #obj small { font-size: 11px; letter-spacing: .3em; opacity: .7; }
  #objMain { font-size: 16px; letter-spacing: .12em; margin-top: 2px; }
  #objSub { font-size: 13px; opacity: .8; margin-top: 2px; letter-spacing: .1em; }
  #prompt { position: fixed; left: 50%; bottom: calc(var(--bar) + 24px); transform: translateX(-50%); z-index: 6; font: inherit;
    font-size: 15px; letter-spacing: .15em; color: var(--ink); background: rgba(0,0,0,.72); border: 1px solid rgba(255,220,180,.55);
    padding: 10px 22px; border-radius: 2px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #prompt.on { opacity: 1; pointer-events: auto; }
  #pauseBtn { position: fixed; top: 14px; left: 14px; z-index: 30; font: inherit; font-size: 13px; letter-spacing: .1em; color: var(--ink);
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25); padding: 6px 12px; border-radius: 2px; cursor: pointer; display: none; }
  body.playing #pauseBtn { display: block; }

  /* 回憶碎片卡片 */
  #memo { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%); z-index: 15; width: min(520px, calc(100% - 32px));
    box-sizing: border-box; background: rgba(0,0,0,.88); border: 1px solid rgba(255,214,170,.35); padding: 28px 28px 20px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; }
  #memo.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  #memo .mt { font-size: 13px; letter-spacing: .4em; color: #f1c79b; }
  #memo p { font-size: clamp(16px, 2.2vw, 20px); line-height: 1.9; letter-spacing: .08em; margin: 16px 0 18px; }
  #memo small { font-size: 12px; opacity: .55; letter-spacing: .2em; }

  /* 章節選擇、完成、暫停 */
  .card h2 { font-weight: 300; letter-spacing: .4em; margin: 0 0 0 .4em; font-size: clamp(24px, 4vw, 34px); }
  .card .btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 0 16px; }
  .card p { margin: 0; letter-spacing: .15em; opacity: .8; }
  #chapList { display: flex; flex-direction: column; gap: 12px; width: min(620px, calc(100% - 32px)); }
  .card button.chap { display: flex; align-items: center; gap: 18px; text-align: left; letter-spacing: .08em; padding: 16px 20px; width: 100%; }
  .chap .cn { font-size: 14px; letter-spacing: .3em; color: #e8b48c; white-space: nowrap; }
  .chap .cb { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .chap .ct { font-weight: 500; font-size: 18px; letter-spacing: .2em; }
  .chap .cd { font-style: normal; font-size: 13px; opacity: .65; }
  .chap .cs { font-size: 12px; opacity: .7; text-align: right; white-space: nowrap; line-height: 1.6; }
  .card button.chap:disabled { opacity: .35; }
  #pauseCard { background: rgba(0,0,0,.72); }
  .card.hide { opacity: 0; pointer-events: none; }
  @media (max-width: 520px) { .card button.chap { flex-wrap: wrap; gap: 8px 14px; } .chap .cs { text-align: left; } }
</style>
</head>

<script>
  if (location.search.includes('shot=')) {
    const log = (m) => { let d = document.getElementById('dbg'); if (!d) { d = document.createElement('pre'); d.id = 'dbg'; d.style.cssText = 'position:fixed;left:0;top:0;z-index:99;color:#f66;font:12px monospace;white-space:pre-wrap;margin:8px'; document.body.appendChild(d); } d.textContent += m + '\n'; };
    addEventListener('error', (e) => log('ERR ' + e.message + ' @' + e.lineno));
    addEventListener('unhandledrejection', (e) => log('REJ ' + (e.reason && e.reason.stack || e.reason)));
    const ce = console.error; console.error = (...a) => { log('CE ' + a.join(' ').slice(0, 600)); ce(...a); };
  }

<script type="module">

/* ============================== 劇情文字 ============================== */
const L1 = '在這個世界上「爸爸 媽媽」是我們人生最親的家人。';
const L2 = '爸爸，媽媽的努力在你小時候是完全看不到的。';
const L3 = '長大了就會知道爸爸，媽媽的努力會是非常之大的。';
const L4 = '把握現在的時間趁爸爸媽媽還年輕多出去跑跑。';
const L5 = '爸爸媽媽老了，就不能這樣了..';
const L6 = '有空多回家吃頓飯，陪他們說說話。';
const L7 = '謝謝你們，爸爸，媽媽。';
// 走在玫瑰海時的回憶字幕（家人的生活）
const WALK_LINES = [
  '小時候，爸爸的肩膀是我看世界最高的地方。',
  '爸爸媽媽總是最早起床，爸爸要出門工作，媽媽要在家裡照顧我們。',
  '下雨天，爸爸媽媽的傘，總是悄悄往我這邊傾。',
  '生病的夜裡，媽媽一整晚沒睡，一次又一次摸著我的額頭。',
  '好吃的總是留給我，他們卻說：「我不喜歡吃。」',
  '不知不覺，爸爸的頭髮白了，媽媽的手也變粗了。',
];
let walkDone = false;

/* ============================== 基本設定 ============================== */
const params = new URLSearchParams(location.search);
const SHOT = params.get('shot');               // 除錯用：walk / end / hug
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) { document.body.classList.add('touch'); document.getElementById('keys').textContent = '左下搖桿 移動　·　右側拖曳 轉視角　·　左上 暫停'; }
const LOW = isTouch;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261120);

/* ============================== 地形 ============================== */
function sst(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function H(x, z) {
  let h = 0.35 * Math.sin(x * 0.08 + 1.0) * Math.cos(z * 0.06) + 0.25 * Math.sin(x * 0.031 - z * 0.045);
  const ax = Math.abs(x), shore = sst(-163, -192, z);
  h += sst(55, 125, ax) * (11 + 4 * Math.sin(z * 0.03 + x * 0.01)) * (1 - 0.7 * shore);
  h += sst(40, 130, z) * 9;
  h -= shore * 7.5;
  return h;
}
function fieldEdgeZ(x) { return -147 + 2.5 * Math.sin(x * 0.21) + 1.5 * Math.sin(x * 0.07 + 2.0); }
function fieldSide(z) { return 66 + 3 * Math.sin(z * 0.13); }

const GLSL_COMMON = /* glsl */`
float sst(float a, float b, float x){ float t = clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
float terrainH(vec2 p){
  float x = p.x, z = p.y;
  float h = 0.35*sin(x*0.08+1.0)*cos(z*0.06) + 0.25*sin(x*0.031 - z*0.045);
  float ax = abs(x);
  float shore = sst(-163.0,-192.0,z);
  h += sst(55.0,125.0,ax)*(11.0+4.0*sin(z*0.03+x*0.01))*(1.0-0.7*shore);
  h += sst(40.0,130.0,z)*9.0;
  h -= shore*7.5;
  return h;
}
float fieldMask(vec2 p){
  float endZ = -147.0 + 2.5*sin(p.x*0.21) + 1.5*sin(p.x*0.07+2.0);
  float side = 66.0 + 3.0*sin(p.y*0.13);
  return step(endZ, p.y) * step(p.y, 30.0) * step(abs(p.x), side) * step(2.4, length(p - vec2(7.0, -84.0)));
}
`;

/* ============================== Renderer / Scene ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio, LOW ? 1.5 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.52;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 8000);
camera.position.set(0, 9, 32);

const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 1.9), THREE.MathUtils.degToRad(175));
scene.fog = new THREE.FogExp2(new THREE.Color(0xc48a74), 0.0034);

// 共用 uniforms
const U = {
  uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uPush: { value: new THREE.Vector3(0, 0, 999) },
  uSunV: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Color(1.0, 0.5, 0.24).multiplyScalar(2.4) },
};

/* ---------- 天空 ---------- */
const sky = new Sky();
sky.scale.setScalar(10000);
{
  const su = sky.material.uniforms;
  su.turbidity.value = 10; su.rayleigh.value = 3.2; su.mieCoefficient.value = 0.005; su.mieDirectionalG.value = 0.82;
  su.sunPosition.value.copy(sunDir);
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
scene.add(sky);

/* ---------- 燈光 ---------- */
const sun = new THREE.DirectionalLight(0xffb27c, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 220 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xb59ac8, 0x4a2a1c, 0.9);
scene.add(hemi);

/* ---------- 共用 shader 片段 ---------- */
const FRAG_HEAD = `uniform vec3 uSunV; uniform vec3 uSunCol; uniform float uTrans;\n`;
const FRAG_TRANS = `{ float sd = pow(max(dot(-normalize(vViewPosition), uSunV), 0.0), 5.0);
  gl_FragColor.rgb += diffuseColor.rgb * uSunCol * (uTrans * sd); }`;
const FRAG_RIM = `{ vec3 vv = normalize(vViewPosition);
  float rim = pow(1.0 - abs(dot(normalize(normal), vv)), 3.0) * pow(max(dot(-vv, uSunV), 0.0), 2.0);
  gl_FragColor.rgb += (diffuseColor.rgb * 0.7 + 0.08) * uSunCol * (uTrans * rim); }`;

function addRim(mat, amt) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uSunV = U.uSunV; sh.uniforms.uSunCol = U.uSunCol; sh.uniforms.uTrans = { value: amt };
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + FRAG_HEAD)
      .replace('#include <opaque_fragment>', '#include <opaque_fragment>\n' + FRAG_RIM);

  return mat;
}

/* ============================== 地面 ============================== */
function noiseTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); fn(g, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const groundDetail = noiseTex(256, (g, s) => {
  g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {
    const v = 120 + R() * 135 | 0; g.fillStyle = `rgba(${v},${v},${v},0.55)`;
    const r = 0.5 + R() * 2.2; const x = R() * s, y = R() * s;
    for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fill(); }
  }
});
groundDetail.colorSpace = THREE.SRGBColorSpace;
groundDetail.repeat.set(260, 260);
groundDetail.anisotropy = 8;

function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;

const CARDS = ['titleCard', 'chapCard', 'doneCard', 'pauseCard', 'endCard'];

}
async function quickBlack(fn) {

async function reveal() {

function resetWorld() {

/* ============================== 鏡頭 ============================== */
const tmpV = new THREE.Vector3(), tmpL = new THREE.Vector3();
function updateCamera(dt) {
  const py = H(player.x, player.z);
  const playPos = tmpV.set(player.x + Math.sin(camYaw) * 4.3, py + 1.9, player.z + Math.cos(camYaw) * 4.3);
  const playLook = tmpL.set(player.x - Math.sin(camYaw) * 3, py + 1.0, player.z - Math.cos(camYaw) * 3);
  if (state === 'debug') { }
  else if (state === 'title' || state === 'loading' || state === 'done') {
    camera.position.set(introFrom.x, introFrom.y + 8, introFrom.z + 26); camLook.set(introFrom.x, 2, introFrom.z - 86);
    if (state === 'loading') { camera.position.set(player.x, py + 8, player.z + 26); camLook.set(player.x, 2, player.z - 86); }
  }
  else if (state === 'intro' || state === 'play') {
    introT += dt;
    const b = easeIO(introT / 7.5);
    if (b < 1) {
      const ip = new THREE.Vector3(introFrom.x, introFrom.y + 8 - introT * 0.5, introFrom.z + 26 - introT * 2.2);
      camera.position.lerpVectors(ip, playPos, b);
      camLook.lerpVectors(new THREE.Vector3(introFrom.x, 2, introFrom.z - 86), playLook, b);
    } else {
      camera.position.lerp(playPos, 1 - Math.exp(-6 * dt));
      camLook.lerp(playLook, 1 - Math.exp(-8 * dt));
    }
  } else if (state === 'scene') {
    camera.position.lerp(sceneCam.pos, 1 - Math.exp(-sceneCam.rate * dt));
    camLook.lerp(sceneCam.look, 1 - Math.exp(-sceneCam.rate * 1.3 * dt));
  } else if (state === 'cut' || state === 'end') {
    let tp, tl, rate = 2.2;
    if (!cut.arrived) {
      tp = new THREE.Vector3(HUG.x + 4.8, HUG.y + 1.45, HUG.z + 2.8);
      tl = new THREE.Vector3((player.x + HUG.x) / 2, HUG.y + 1.0, (player.z + HUG.z) / 2);
      rate = 1.6;
    } else {
      const k = easeIO(cut.hugT / 26);
      const a = lerp(1.05, 0.3, k), r = lerp(4.9, 3.5, k);
      tp = new THREE.Vector3(HUG.x + Math.sin(a) * r, HUG.y + lerp(1.45, 1.22, k), HUG.z + Math.cos(a) * r);
      tl = new THREE.Vector3(HUG.x, HUG.y + 1.02, HUG.z - 0.25);
      if (cut.ending) {
        const e = easeIO(cut.endT / 9);
        tp.lerp(new THREE.Vector3(HUG.x + 1.5, HUG.y + 5.5, HUG.z + 14), e);
        tl.lerp(new THREE.Vector3(HUG.x, HUG.y + 2, HUG.z - 40), e);
      }
    }
    camera.position.lerp(tp, 1 - Math.exp(-rate * dt));
    camLook.lerp(tl, 1 - Math.exp(-rate * 1.3 * dt));
  }
  const gy = H(camera.position.x, camera.position.z) + 0.6;
  if (camera.position.y < gy) camera.position.y = gy;
  camera.lookAt(camLook);
}

const PM = new THREE.Matrix4(), PQ = new THREE.Quaternion(), PS = new THREE.Vector3(1, 1, 1);
function updatePetals(dt, t) {
  if (!petalMesh.visible) return;
  const c = camera.position;
  for (let i = 0; i < PETALS; i++) {
    const s = petalState[i];
    s.p.x += (1.1 + Math.sin(t * s.w + s.ph) * 0.6) * dt;
    s.p.z += (-0.35 + Math.cos(t * s.w * 0.7 + s.ph) * 0.4) * dt;
    s.p.y += (Math.sin(t * s.w * 1.3 + s.ph) * 0.35 - 0.12) * dt;
    s.r.x += dt * s.w * 1.4; s.r.y += dt * s.w * 0.9;
    const gx = s.p.x - c.x, gz = s.p.z - c.z;
    if (gx > 20) s.p.x -= 40; if (gx < -20) s.p.x += 40; if (gz > 20) s.p.z -= 40; if (gz < -20) s.p.z += 40;
    const gh = H(s.p.x, s.p.z);
    if (s.p.y < gh + 0.25) s.p.y = gh + 2.4 + Math.random(); if (s.p.y > gh + 3.5) s.p.y = gh + 0.5;
    PM.compose(s.p, PQ.setFromEuler(s.r), PS); petalMesh.setMatrixAt(i, PM);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

/* ============================== 主迴圈 ============================== */
const focusV = new THREE.Vector3();
function frame() {
  const rdt = Math.min(clock.getDelta(), 1 / 20);
  const dt = paused ? 0 : rdt;
  gameTime += dt; const t = gameTime;
  tickTimers();
  U.uTime.value = t;
  if (!paused) {
    if (state === 'intro' || state === 'play') updatePlayer(dt);
    if (chap && chap.update && (state === 'intro' || state === 'play' || state === 'scene')) chap.update(dt);
    if (chap && chap.n === 3 && (state === 'cut' || state === 'end')) updateCut(dt);
    updateFrags(dt, t);
    if (chap && chap.parents) chap.parents(dt, t); else parentsUpdate(dt, t);
    kidUpdate(dt, t);
    updateUmbrellas();
    updateCamera(dt);
    updatePetals(dt, t);
  }
  U.uCam.value.copy(camera.position);
  U.uPush.value.set(player.x, 0, player.z);
  camera.updateMatrixWorld();
  U.uSunV.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
  if (state === 'cut' || state === 'end') focusV.copy(HUG); else focusV.set(player.x, H(player.x, player.z), player.z);
  sun.target.position.copy(focusV); sun.position.copy(focusV).addScaledVector(sunDir, 120);
  water.material.uniforms.time.value = t * 0.6;
  vignette.uniforms.uTime.value = t % 10;
  Snd.update(clamp(1 - (player.z + 120) / 40, 0, 1), t);
  composer.render();
  requestAnimationFrame(frame);
}

  if (SHOT === 'carry') { ch.phase = 'scene'; ch.onShoulders = true; ch.walk = 1; state = 'scene'; setObjective(null); }
  if (SHOT === 'say') { say([['爸爸', '來，爸爸帶你去看更遠的地方！']]); }
  if (SHOT === 'memo') { showMemo('回憶碎片　1 / 3', CHAPTERS[0].frags[0].text); }
  if (SHOT === 'face' || SHOT === 'kidface') {
    state = 'debug'; player.x = 1.4; player.z = PZ; player.yaw = player.tyaw = Math.PI;
    camera.position.set(SHOT === 'face' ? 0.15 : 1.4, H(0, PZ) + (SHOT === 'face' ? 1.55 : 1.1), PZ - (SHOT === 'face' ? 1.5 : 0.85));
    camLook.set(SHOT === 'face' ? 0 : 1.4, H(0, PZ) + (SHOT === 'face' ? 1.5 : 1.08), PZ); camera.lookAt(camLook);
  }
  if (SHOT === 'end') { player.z = -138; player.x = 1.5; }
  if (SHOT === 'hug') { player.z = HUG.z; player.x = HUG.x; startCut(); cut.t = 5; cut.arrived = true; cut.hugT = Number(params.get('ht') || 6); cut.subsStarted = true; }
  if (SHOT === 'sub') { document.body.classList.add('cine'); setSub(L2); subEl.classList.add('on'); }
  camYaw = 0;
} else goTitle();
frame();
</script>
