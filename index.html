<style>
  :root { --bar: 15vh; --ink: #f4ece4; }

    padding: 0 16px; opacity: 0; transition: opacity 1.1s ease; font-weight: 300; }

  /* 全黑畫面 */

    justify-content: center; transition: opacity 2.4s ease; }

    color: var(--ink); background: transparent; border: 1px solid rgba(244,236,228,.45); border-radius: 2px; cursor: pointer;

  .card button:hover { background: rgba(244,236,228,.08); border-color: rgba(244,236,228,.85); }

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== 劇情文字 ============================== */
const L1 = '在這個世界上「爸爸 媽媽」是我們人生最親的家人。';
const L2 = '爸爸，媽媽的努力在你小時候是完全看不到的。';
const L3 = '長大了就會知道爸爸，媽媽的努力會是非常之大的。';
const L4 = '把握現在的時間趁爸爸媽媽還年輕多出去跑跑。';
const L5 = '爸爸媽媽老了，就不能這樣了..';
const L6 = '有空多回家吃頓飯，陪他們說說話。';
const L7 = '謝謝你們，爸爸，媽媽。';
// 走在玫瑰海時的回憶字幕（家人的生活）
const WALK_LINES = [
  '小時候，爸爸的肩膀是我看世界最高的地方。',
  '媽媽總是最早起床，把早餐放在桌上，再輕輕叫我起床。',
  '下雨天，爸爸媽媽的傘，總是悄悄往我這邊傾。',
  '生病的夜裡，媽媽一整晚沒睡，一次又一次摸著我的額頭。',
  '好吃的總是留給我，他們卻說：「我不喜歡吃。」',
  '不知不覺，爸爸的頭髮白了，媽媽的手也變粗了。',
];
let walkDone = false;

/* ============================== 基本設定 ============================== */
const params = new URLSearchParams(location.search);
const SHOT = params.get('shot');               // 除錯用：walk / end / hug
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) { document.body.classList.add('touch'); document.getElementById('keys').textContent = '左下搖桿 移動　·　右側拖曳 轉視角'; }
const LOW = isTouch;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeIO = (t) => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261120);

/* ============================== 地形 ============================== */
function sst(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function H(x, z) {
  let h = 0.35 * Math.sin(x * 0.08 + 1.0) * Math.cos(z * 0.06) + 0.25 * Math.sin(x * 0.031 - z * 0.045);
  const ax = Math.abs(x), shore = sst(-163, -192, z);
  h += sst(55, 125, ax) * (11 + 4 * Math.sin(z * 0.03 + x * 0.01)) * (1 - 0.7 * shore);
  h += sst(40, 130, z) * 9;
  h -= shore * 7.5;
  return h;
}
function fieldEdgeZ(x) { return -147 + 2.5 * Math.sin(x * 0.21) + 1.5 * Math.sin(x * 0.07 + 2.0); }
function fieldSide(z) { return 66 + 3 * Math.sin(z * 0.13); }

const GLSL_COMMON = /* glsl */`
float sst(float a, float b, float x){ float t = clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
float terrainH(vec2 p){
  float x = p.x, z = p.y;
  float h = 0.35*sin(x*0.08+1.0)*cos(z*0.06) + 0.25*sin(x*0.031 - z*0.045);
  float ax = abs(x);
  float shore = sst(-163.0,-192.0,z);
  h += sst(55.0,125.0,ax)*(11.0+4.0*sin(z*0.03+x*0.01))*(1.0-0.7*shore);
  h += sst(40.0,130.0,z)*9.0;
  h -= shore*7.5;
  return h;
}
float fieldMask(vec2 p){
  float endZ = -147.0 + 2.5*sin(p.x*0.21) + 1.5*sin(p.x*0.07+2.0);
  float side = 66.0 + 3.0*sin(p.y*0.13);
  return step(endZ, p.y) * step(p.y, 30.0) * step(abs(p.x), side);
}
`;

/* ============================== Renderer / Scene ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio, LOW ? 1.5 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.52;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 8000);
camera.position.set(0, 9, 32);

const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 1.9), THREE.MathUtils.degToRad(175));
scene.fog = new THREE.FogExp2(new THREE.Color(0xc48a74), 0.0034);

// 共用 uniforms
const U = {
  uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uPush: { value: new THREE.Vector3(0, 0, 999) },
  uSunV: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Color(1.0, 0.5, 0.24).multiplyScalar(2.4) },
};

/* ---------- 天空 ---------- */
const sky = new Sky();
sky.scale.setScalar(10000);
{
  const su = sky.material.uniforms;
  su.turbidity.value = 10; su.rayleigh.value = 3.2; su.mieCoefficient.value = 0.005; su.mieDirectionalG.value = 0.82;
  su.sunPosition.value.copy(sunDir);
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(sky);
  scene.environment = pm.fromScene(envScene).texture;
  scene.add(sky);
}

/* ---------- 燈光 ---------- */
const sun = new THREE.DirectionalLight(0xffb27c, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 220 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xb59ac8, 0x4a2a1c, 0.9));

/* ---------- 共用 shader 片段 ---------- */
const FRAG_HEAD = `uniform vec3 uSunV; uniform vec3 uSunCol; uniform float uTrans;\n`;
const FRAG_TRANS = `{ float sd = pow(max(dot(-normalize(vViewPosition), uSunV), 0.0), 5.0);
  gl_FragColor.rgb += diffuseColor.rgb * uSunCol * (uTrans * sd); }`;
const FRAG_RIM = `{ vec3 vv = normalize(vViewPosition);
  float rim = pow(1.0 - abs(dot(normalize(normal), vv)), 3.0) * pow(max(dot(-vv, uSunV), 0.0), 2.0);
  gl_FragColor.rgb += (diffuseColor.rgb * 0.7 + 0.08) * uSunCol * (uTrans * rim); }`;

function addRim(mat, amt) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uSunV = U.uSunV; sh.uniforms.uSunCol = U.uSunCol; sh.uniforms.uTrans = { value: amt };
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + FRAG_HEAD)
      .replace('#include <opaque_fragment>', '#include <opaque_fragment>\n' + FRAG_RIM);
  };
  mat.customProgramCacheKey = () => 'rim' + amt;
  return mat;
}

/* ============================== 地面 ============================== */
function noiseTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); fn(g, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const groundDetail = noiseTex(256, (g, s) => {
  g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {
    const v = 120 + R() * 135 | 0; g.fillStyle = `rgba(${v},${v},${v},0.55)`;
    const r = 0.5 + R() * 2.2; const x = R() * s, y = R() * s;
    for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, 7); g.fill(); }
  }
});
groundDetail.colorSpace = THREE.SRGBColorSpace;
groundDetail.repeat.set(260, 260);
groundDetail.anisotropy = 8;

function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const h = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(h(xi, zi), h(xi + 1, zi), u), lerp(h(xi, zi + 1), h(xi + 1, zi + 1), u), v);
}
{
  const g = new THREE.PlaneGeometry(900, 900, LOW ? 220 : 320, LOW ? 220 : 320);
  g.rotateX(-Math.PI / 2); g.translate(0, 0, -100);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = H(x, z); p.setY(i, y);
    const n = vnoise(x * 0.15, z * 0.15) * 0.6 + vnoise(x * 0.6, z * 0.6) * 0.4;
    // 草地
    let c = [lerp(0.05, 0.09, n), lerp(0.075, 0.11, n), lerp(0.018, 0.03, n)];
    // 玫瑰田（暗紅綠）
    const inF = z > fieldEdgeZ(x) - 1.5 && z < 31 && Math.abs(x) < fieldSide(z) + 1.5;
    if (inF) c = [lerp(0.045, 0.11, n), lerp(0.07, 0.025, n), lerp(0.02, 0.018, n)];
    // 山丘
    const hill = sst(60, 120, Math.abs(x)) + sst(45, 120, z);
    c = c.map((v, k) => lerp(v, [0.035, 0.055, 0.02][k] * (0.8 + n * 0.4), clamp(hill, 0, 1)));
    // 沙灘
    const sand = sst(-0.6, -1.8, y), wet = sst(-2.4, -3.1, y);
    c = c.map((v, k) => lerp(v, [0.32, 0.22, 0.13][k], sand));
    c = c.map((v, k) => lerp(v, [0.13, 0.085, 0.05][k], wet));
    col.push(...c);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, map: groundDetail, roughness: 0.96 }));
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ============================== 海 ============================== */
const waterNormals = (() => {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N);
  const waves = []; const r2 = rng(7);
  for (let i = 0; i < 22; i++) waves.push({ fx: Math.round(r2() * 14 - 7), fy: Math.round(r2() * 14 - 7) || 1, a: 1 / (1 + i * 0.35), p: r2() * 6.28 });
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0;
    for (const w of waves) { const ph = 6.2832 * (w.fx * x + w.fy * y) / N + w.p; const cc = Math.cos(ph) * w.a; dx += cc * w.fx; dy += cc * w.fy; }
    const s = 0.05; let nx = -dx * s, ny = -dy * s, nz = 1; const l = Math.hypot(nx, ny, nz);
    const o = (y * N + x) * 4; img.data[o] = (nx / l * .5 + .5) * 255; img.data[o + 1] = (ny / l * .5 + .5) * 255; img.data[o + 2] = (nz / l * .5 + .5) * 255; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();
const water = new Water(new THREE.PlaneGeometry(20000, 20000), {
  textureWidth: LOW ? 256 : 512, textureHeight: LOW ? 256 : 512, waterNormals,
  sunDirection: sunDir.clone(), sunColor: 0xffc48a, waterColor: 0x16202c, distortionScale: 2.6, fog: false,
});
water.rotation.x = -Math.PI / 2; water.position.y = -3.0;
scene.add(water);
const hideInReflection = [];
{
  const orig = water.onBeforeRender;
  water.onBeforeRender = function (...a) {
    const vis = hideInReflection.map(o => o.visible); hideInReflection.forEach(o => o.visible = false);
    orig.apply(this, a);
    hideInReflection.forEach((o, i) => o.visible = vis[i]);
  };
}

/* ============================== 玫瑰 ============================== */
function petal(w, h, cup, curl, sw, shh, c0, c1) {
  const g = new THREE.PlaneGeometry(w, h, sw, shh); g.translate(0, h / 2, 0);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i); const y = p.getY(i), u = x / (w / 2), v = y / h;
    x *= 0.35 + 0.65 * Math.sin(Math.min(v, 1) * Math.PI * 0.92);
    p.setXYZ(i, x, y, -cup * u * u + curl * v * v);
    const k = lerp(c0, c1, Math.pow(clamp(v, 0, 1), 0.8)); col.push(k, k, k);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
function leaf(w, l, sw, sh, tilt, ang, pos, scale = 1) {
  const g = new THREE.PlaneGeometry(w, l, sw, sh); g.translate(0, l / 2, 0);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i); const y = p.getY(i), u = x / (w / 2), v = y / l;
    x *= 0.06 + 0.94 * Math.pow(Math.max(0, Math.sin(Math.min(v, 1) * Math.PI * 0.95 + 0.05)), 0.8);
    p.setXYZ(i, x, y, -0.25 * w * u * u + 0.18 * l * v * v);
    const k = 0.8 + 0.5 * v; col.push(0.032 * k, 0.085 * k, 0.018 * k);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  g.scale(scale, scale, scale); g.rotateX(tilt); g.rotateY(ang); g.translate(pos.x, pos.y, pos.z);
  return g;
}
function roseHead(lod) {
  const parts = [];
  const layers = lod === 0 ? [
    { n: 3, w: .034, h: .042, r: .003, tilt: .12, cup: .010, curl: -.006, y: .012, s: .5 },
    { n: 5, w: .050, h: .052, r: .008, tilt: .42, cup: .012, curl: .002, y: .006, s: .68 },
    { n: 5, w: .062, h: .058, r: .013, tilt: .80, cup: .010, curl: .014, y: 0, s: .85 },
    { n: 5, w: .072, h: .060, r: .018, tilt: 1.18, cup: .008, curl: .022, y: -.006, s: 1 },

/* ============================== 聲音 ============================== */
const Snd = {
  ctx: null, master: null, on: true,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(ctx.destination);
    // 殘響
    const len = ctx.sampleRate * 3.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.rev = ctx.createConvolver(); this.rev.buffer = ir;
    const rg = ctx.createGain(); rg.gain.value = 0.45; this.rev.connect(rg); rg.connect(this.master);
    this.music = ctx.createGain(); this.music.gain.value = 0.2; this.music.connect(this.master); this.music.connect(this.rev);
    // 風、浪
    const nb = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), nd = nb.getChannelData(0);
    let b = 0; for (let i = 0; i < nd.length; i++) { b = b * 0.985 + (Math.random() * 2 - 1) * 0.015; nd[i] = b * 6; }
    const mkNoise = (type, f, g) => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const gn = ctx.createGain(); gn.gain.value = g; s.connect(fl); fl.connect(gn); gn.connect(this.master); s.start(); return { fl, gn }; };
    this.wind = mkNoise('bandpass', 500, 0.05);
    this.wave = mkNoise('lowpass', 700, 0.0);
    this.next = ctx.currentTime + 0.2; this.step = 0;
    setInterval(() => this.schedule(), 120);
  },
  note(f, t, dur, v) {
    const ctx = this.ctx, o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain(), lp = ctx.createBiquadFilter();
    o1.type = 'sine'; o1.frequency.value = f; o2.type = 'triangle'; o2.frequency.value = f * 2.001; g2.gain.value = 0.18;
    lp.type = 'lowpass'; lp.frequency.value = 2200;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(this.music);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  },
  schedule() {
    if (!this.ctx) return;
    const m = (n) => 440 * Math.pow(2, (n - 69) / 12);
    const CH = [[48, 55, 60, 64, 67, 64, 60, 55], [47, 55, 59, 62, 67, 62, 59, 55], [45, 52, 57, 60, 64, 60, 57, 52], [41, 48, 53, 57, 60, 57, 53, 48]];
    const MEL = [[76, null, 74, null], [74, null, 71, 72], [72, null, 69, null], [69, 67, 65, null]];
    const STEP = 0.42;
    while (this.next < this.ctx.currentTime + 0.4) {
      const bar = (this.step >> 3) % 4, s = this.step & 7;
      this.note(m(CH[bar][s]), this.next, s === 0 ? 4 : 2.4, s === 0 ? 0.32 : 0.15);
      if ((s & 1) === 0 && MEL[bar][s >> 1] && (this.step >> 5) % 2 === 1) this.note(m(MEL[bar][s >> 1]), this.next, 3, 0.14);
      this.next += STEP; this.step++;
    }
  },
  update(nearSea, t) {
    if (!this.ctx) return;
    const ct = this.ctx.currentTime;
    this.wind.fl.frequency.setTargetAtTime(420 + Math.sin(t * 0.3) * 160, ct, 0.5);
    this.wind.gn.gain.setTargetAtTime(0.035 + 0.02 * Math.sin(t * 0.21), ct, 0.5);
    this.wave.gn.gain.setTargetAtTime(nearSea * (0.06 + 0.05 * Math.max(0, Math.sin(t * 0.85))), ct, 0.4);
  },
  fadeMusic(v, s) { if (this.ctx) this.music.gain.setTargetAtTime(v, this.ctx.currentTime, s); },
  toggle() { this.on = !this.on; if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.9 : 0, this.ctx.currentTime, 0.1); $('mute').textContent = '聲音：' + (this.on ? '開' : '關'); },
};
$('mute').onclick = () => Snd.toggle();

const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const joy = { id: null, x: 0, y: 0, cx: 0, cy: 0 };
let look = { id: null, lx: 0 }, camYaw = 0, lastLook = -10;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', (e) => {
  if (isTouch && e.pointerType === 'touch' && e.clientX < innerWidth * 0.45 && joy.id === null) {
    joy.id = e.pointerId; const r = $('joy').getBoundingClientRect(); joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2; moveJoy(e);
  } else if (look.id === null) { look.id = e.pointerId; look.lx = e.clientX; }
  cvs.setPointerCapture(e.pointerId);
});
function moveJoy(e) {
  let dx = (e.clientX - joy.cx) / 50, dy = (e.clientY - joy.cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = -dy; $('joy').firstElementChild.style.transform = `translate(${dx * 40}px,${dy * 40}px)`;
}
cvs.addEventListener('pointermove', (e) => {
  if (e.pointerId === joy.id) moveJoy(e);
  else if (e.pointerId === look.id) { camYaw -= (e.clientX - look.lx) * (isTouch ? 0.008 : 0.005); look.lx = e.clientX; lastLook = clock.elapsedTime; }
});
const endPtr = (e) => {
  if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; $('joy').firstElementChild.style.transform = ''; }
  if (e.pointerId === look.id) look.id = null;
};
cvs.addEventListener('pointerup', endPtr); cvs.addEventListener('pointercancel', endPtr);

/* ============================== 遊戲狀態 ============================== */
let state = 'title';   // title → intro → play → cut → end
let introT = 0, canMove = false;
const cut = { t: 0, arrived: false, hugT: 0, ending: false, endT: 0, subsStarted: false, faded: false };
const camLook = new THREE.Vector3(0, 1, -40);
const clock = new THREE.Clock();

function updatePlayer(dt) {
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let iy = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
  if (!canMove) ix = iy = 0;
  const mag = Math.min(1, Math.hypot(ix, iy));
  if (mag > 0.08) {
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    const dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
    player.tyaw = Math.atan2(dx, dz);
    const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > 0.9;
    player.speed = damp(player.speed, (run ? 6.4 : 3.7) * mag, 5, dt);
  } else player.speed = damp(player.speed, 0, 7, dt);
  player.yaw = lerpAngle(player.yaw, player.tyaw, 1 - Math.exp(-9 * dt));
  player.x += Math.sin(player.yaw) * player.speed * dt;
  player.z += Math.cos(player.yaw) * player.speed * dt;
  player.x = clamp(player.x, -58, 58); player.z = clamp(player.z, -150, 28);
  // 自動讓鏡頭慢慢跟到角色背後
  if (player.speed > 0.5 && clock.elapsedTime - lastLook > 1.5) camYaw = lerpAngle(camYaw, player.yaw - Math.PI, 1 - Math.exp(-0.9 * dt));
  if (!walkDone) player.z = Math.max(player.z, -144);
  if (state === 'play' && walkDone && (Math.hypot(player.x - HUG.x, player.z - HUG.z) < 14 || player.z < -141)) startCut();
}
function kidPose(dt) {
  const amt = Math.min(1, player.speed / 3.2), run = clamp((player.speed - 3.7) / 2.7, 0, 1);
  player.phase += dt * Math.PI * 2 * player.speed / (1.0 + 0.13 * player.speed);
  const q = basePose(clock.elapsedTime, 1);
  if (player.speed > 0.05) walkPose(q, player.phase, amt, run);
  return q;
}

function startCut() {
  state = 'cut'; cut.t = 0; canMove = false;
  $('hint').classList.remove('on'); document.body.classList.remove('playing');
}
function updateCut(dt) {
  cut.t += dt;
  // 小孩衝上去
  if (!cut.arrived) {
    const dx = HUG.x - player.x, dz = HUG.z - player.z, d = Math.hypot(dx, dz);
    if (cut.t > 0.35) {
      player.tyaw = Math.atan2(dx, dz);
      player.yaw = lerpAngle(player.yaw, player.tyaw, 1 - Math.exp(-10 * dt));
      player.speed = damp(player.speed, Math.min(6.3, 1.2 + d * 2.2), 4, dt);
      const step = Math.min(d, player.speed * dt);
      player.x += dx / d * step; player.z += dz / d * step;
      if (d < 0.06) { cut.arrived = true; player.speed = 0; }
    } else player.speed = damp(player.speed, 0, 6, dt);
  } else {
    cut.hugT += dt;
    player.yaw = lerpAngle(player.yaw, Math.PI, 1 - Math.exp(-6 * dt));
    if (cut.hugT > 1.3 && !cut.subsStarted) {
      cut.subsStarted = true;
      subLines([[L4, 5600], [L5, 6200], [L6, 5200], [L7, 5600]]).then(() => { cut.ending = true; Snd.fadeMusic(0, 3); });
    }
  }
  if (cut.ending) {
    cut.endT += dt;
    if (cut.endT > 4.5 && !cut.faded) { cut.faded = true; blackSub.textContent = ''; blackEl.classList.remove('off'); setTimeout(() => { state = 'end'; $('endCard').classList.add('show'); }, 3000); }
  }
}

function parentsUpdate(dt, t) {
  const turning = state === 'cut';
  const k = turning ? easeIO((cut.t - 0.2) / 1.7) : 0;
  const hugging = turning && cut.arrived;
  for (const [P, idle, hugPos, yawT, inner, ph] of [[dad, DAD_IDLE, DAD_HUG, DAD_YAW, 1, 0], [mom, MOM_IDLE, MOM_HUG, MOM_YAW, 0, 2]]) {
    const x = lerp(idle.x, hugPos.x, k), z = lerp(idle.y, hugPos.y, k);
    P.root.position.set(x, H(x, z), z);
    P.root.rotation.y = lerp(Math.PI, yawT, k);
    const q = basePose(t, ph);
    if (!turning || k < 0.25) {
      // 牽著手，一起看夕陽
      q['shZ' + inner] = side(inner) * 0.47; q['shX' + inner] = -0.12; q['elX' + inner] = -0.08;
      if (P === mom) { q.nkZ = 0.12; q.nkX = 0.08; }
      if (P.c.hairFall) { P.c.hairFall.rotation.x = Math.sin(t * 1.7) * 0.06; P.c.hairFall.rotation.z = Math.sin(t * 1.1) * 0.05; }
      blendPose(P, q, dt, 5);
    } else if (!hugging) {
      // 張開雙手
      for (const i of [0, 1]) { q['shX' + i] = -0.72; q['shZ' + i] = side(i) * 0.78; q['elX' + i] = -0.38; }
      q.spX = 0.14; q.nkX = 0.12; q.thX0 = q.thX1 = -0.32; q.knX0 = q.knX1 = 0.58;
      blendPose(P, q, dt, 3.2);
    } else {
      // 擁抱
      for (const i of [0, 1]) { q['shX' + i] = -1.12; q['shZ' + i] = side(i) * 0.32; q['elZ' + i] = -side(i) * 1.25; q['elX' + i] = -0.25; }
      const mm = P === mom; q.spX = mm ? 0.5 : 0.42; q.spZ = Math.sin(t * 0.9 + ph) * 0.03; q.nkX = 0.28; q.thX0 = q.thX1 = mm ? -0.3 : -0.72; q.knX0 = q.knX1 = mm ? 0.55 : 1.22;
      blendPose(P, q, dt, 3.5);
    }
    if (P.c.hairFall) { P.c.hairFall.rotation.x = Math.sin(t * 1.7) * 0.06 + 0.02; P.c.hairFall.rotation.z = Math.sin(t * 1.1) * 0.05; }
    if (P.c.skirtMesh) P.c.skirtMesh.rotation.z = Math.sin(t * 1.3) * 0.025;
  }
}

function kidUpdate(dt, t) {
  kid.root.position.set(player.x, H(player.x, player.z), player.z);
  kid.root.rotation.y = player.yaw;
  if (state === 'cut' && cut.arrived) {
    const q = basePose(t, 1);
    for (const i of [0, 1]) { q['shX' + i] = -1.5; q['shZ' + i] = side(i) * 1.0; q['elX' + i] = -0.5; q['elZ' + i] = -side(i) * 0.6; }
    q.nkX = -0.18; q.spX = 0.05; q.spZ = Math.sin(t * 0.9) * 0.03;
    blendPose(kid, q, dt, 5);
  } else blendPose(kid, kidPose(dt), dt, 18);
}

const tmpV = new THREE.Vector3(), tmpL = new THREE.Vector3();
function updateCamera(dt) {
  const py = H(player.x, player.z);
  const playPos = tmpV.set(player.x + Math.sin(camYaw) * 4.3, py + 1.9, player.z + Math.cos(camYaw) * 4.3);
  const playLook = tmpL.set(player.x - Math.sin(camYaw) * 3, py + 1.0, player.z - Math.cos(camYaw) * 3);
  if (state === 'debug') { }
  else if (state === 'title') { camera.position.set(0, 9, 32); camLook.set(0, 2, -80); }
  else if (state === 'intro' || state === 'play') {
    introT += dt;
    const b = easeIO(introT / 7.5);
    const ip = new THREE.Vector3(0, 8 - introT * 0.5, 32 - introT * 2.2);
    if (b < 1) {
      camera.position.lerpVectors(ip, playPos, b);
      camLook.lerpVectors(new THREE.Vector3(0, 2, -80), playLook, b);
    } else {
      camera.position.lerp(playPos, 1 - Math.exp(-6 * dt));
      camLook.lerp(playLook, 1 - Math.exp(-8 * dt));
    }
  } else if (state === 'cut' || state === 'end') {
    let tp, tl, rate = 2.2;
    if (!cut.arrived) {
      tp = new THREE.Vector3(HUG.x + 4.8, HUG.y + 1.45, HUG.z + 2.8);
      tl = new THREE.Vector3((player.x + HUG.x) / 2, HUG.y + 1.0, (player.z + HUG.z) / 2);
      rate = 1.6;
    } else {
      const k = easeIO(cut.hugT / 26);
      const a = lerp(1.05, 0.3, k), r = lerp(4.9, 3.5, k);
      tp = new THREE.Vector3(HUG.x + Math.sin(a) * r, HUG.y + lerp(1.45, 1.22, k), HUG.z + Math.cos(a) * r);
      tl = new THREE.Vector3(HUG.x, HUG.y + 1.02, HUG.z - 0.25);
      if (cut.ending) {
        const e = easeIO(cut.endT / 9);
        tp.lerp(new THREE.Vector3(HUG.x + 1.5, HUG.y + 5.5, HUG.z + 14), e);
        tl.lerp(new THREE.Vector3(HUG.x, HUG.y + 2, HUG.z - 40), e);
      }
    }
    camera.position.lerp(tp, 1 - Math.exp(-rate * dt));
    camLook.lerp(tl, 1 - Math.exp(-rate * 1.3 * dt));
  }
  const gy = H(camera.position.x, camera.position.z) + 0.6;
  if (camera.position.y < gy) camera.position.y = gy;
  camera.lookAt(camLook);
}

const PM = new THREE.Matrix4(), PQ = new THREE.Quaternion(), PS = new THREE.Vector3(1, 1, 1);
function updatePetals(dt, t) {
  const c = camera.position;
  for (let i = 0; i < PETALS; i++) {
    const s = petalState[i];
    s.p.x += (1.1 + Math.sin(t * s.w + s.ph) * 0.6) * dt;
    s.p.z += (-0.35 + Math.cos(t * s.w * 0.7 + s.ph) * 0.4) * dt;
    s.p.y += (Math.sin(t * s.w * 1.3 + s.ph) * 0.35 - 0.12) * dt;
    s.r.x += dt * s.w * 1.4; s.r.y += dt * s.w * 0.9;
    const gx = s.p.x - c.x, gz = s.p.z - c.z;
    if (gx > 20) s.p.x -= 40; if (gx < -20) s.p.x += 40; if (gz > 20) s.p.z -= 40; if (gz < -20) s.p.z += 40;
    const gh = H(s.p.x, s.p.z);
    if (s.p.y < gh + 0.25) s.p.y = gh + 2.4 + Math.random(); if (s.p.y > gh + 3.5) s.p.y = gh + 0.5;
    PM.compose(s.p, PQ.setFromEuler(s.r), PS); petalMesh.setMatrixAt(i, PM);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

/* ============================== 主迴圈 ============================== */
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  U.uTime.value = t;
  if (state === 'intro' || state === 'play') updatePlayer(dt);
  if (state === 'cut' || state === 'end') updateCut(dt);
  kidUpdate(dt, t);
  parentsUpdate(dt, t);
  updateCamera(dt);
  updatePetals(dt, t);
  U.uCam.value.copy(camera.position);
  U.uPush.value.set(player.x, 0, player.z);
  camera.updateMatrixWorld();
  U.uSunV.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
  const focus = (state === 'cut' || state === 'end') ? HUG : new THREE.Vector3(player.x, H(player.x, player.z), player.z);
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(sunDir, 120);
  water.material.uniforms.time.value = t * 0.6;
  vignette.uniforms.uTime.value = t % 10;
  Snd.update(clamp(1 - (player.z + 120) / 40, 0, 1), t);
  composer.render();
  requestAnimationFrame(frame);
}

async function story() {

  canMove = true; document.body.classList.add('playing'); state = 'play';
  $('hint').classList.add('on'); setTimeout(() => $('hint').classList.remove('on'), 10000);
  await sleep(600);
  await subLines([[L2, 5200], [L3, 5800], ...WALK_LINES.map(t => [t, 4300])]);

}

};
$('againBtn').onclick = () => { location.href = location.pathname; };

renderer.compile(scene, camera);
$('startBtn').disabled = false; $('startBtn').textContent = '開始遊戲';

// 除錯鏡頭（?shot=walk / end / hug）
if (SHOT) {
  $('titleCard').classList.add('hide'); blackEl.classList.add('off');
  state = 'play'; introT = 99; canMove = true;
  walkDone = true;
  if (SHOT === 'walk') { player.z = -70; }
  if (SHOT === 'face' || SHOT === 'kidface') {
    state = 'debug'; player.x = 1.4; player.z = PZ; player.yaw = player.tyaw = Math.PI;
    camera.position.set(SHOT === 'face' ? 0.15 : 1.4, H(0, PZ) + (SHOT === 'face' ? 1.55 : 1.1), PZ - (SHOT === 'face' ? 1.5 : 0.85));
    camLook.set(SHOT === 'face' ? 0 : 1.4, H(0, PZ) + (SHOT === 'face' ? 1.5 : 1.08), PZ); camera.lookAt(camLook);
  }
  if (SHOT === 'end') { player.z = -138; player.x = 1.5; }
  if (SHOT === 'hug') { player.z = HUG.z; player.x = HUG.x; startCut(); cut.t = 5; cut.arrived = true; cut.hugT = Number(params.get('ht') || 6); cut.subsStarted = true; }
  if (SHOT === 'sub') { document.body.classList.add('cine'); subEl.textContent = L2; subEl.classList.add('on'); }
  camYaw = 0;
}
frame();
</script>
</body>
